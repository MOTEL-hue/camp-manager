name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test
      - name: server tests
        run: cd server && npm ci && npm test
      - name: syntax check
        run: for f in main.js preload.js renderer/*.js renderer/views/*.js; do node --check "$f"; done
