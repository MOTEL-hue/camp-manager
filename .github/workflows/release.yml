# כל push ל-main עם מספר גרסה חדש ב-package.json בונה קובץ התקנה לווינדוס ומפרסם אותו.
# התוכנות המותקנות מוצאות את הגרסה החדשה לבד ומתעדכנות.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # בונים בלי להעלות, ומעלים בפקודה אחת עם gh: ב-electron-builder 26 ההעלאה המקבילה ניסתה ליצור את
      # אותה גרסה פעמיים ונכשלה ("Published releases must have a valid tag").
      - run: npx electron-builder --win --x64 --publish never
      - name: fast portable (zip) and code-only update
        shell: bash
        run: |
          V="${{ needs.check.outputs.version }}"
          # הגרסה הניידת המהירה: התיקייה הלא-ארוזה, עם הסימון portable.flag - נפתחת מיד, בלי פירוק בכל פעם.
          mv dist/win-unpacked dist/camp-manager
          echo "הקובץ הזה מסמן שזו גרסה ניידת: הנתונים נשמרים בתיקייה 'נתוני ניהול קייטנות' ליד התוכנה. אל תמחקו אותו." > dist/camp-manager/portable.flag
          (cd dist && 7z a -tzip -mx=9 "camp-manager-fast-portable-$V.zip" camp-manager > /dev/null)
          # עדכון קוד בלבד (כמה מגה): app.asar דחוס + קובץ app-update.json עם טביעת האצבע.
          node scripts/make-update-manifest.js "$V" dist/camp-manager/resources/app.asar dist/update-assets
      - name: publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ needs.check.outputs.version }}"
          cat > release-notes.md <<EOF
          ## גרסה $V - מה להוריד?

          **התקנה (מומלץ לרוב האנשים):** מורידים את \`camp-manager-setup-$V.exe\` ופותחים. התוכנה מותקנת במחשב, נוצר קיצור דרך בשולחן העבודה, והיא מתעדכנת לבד.

          **גרסה ניידת (בלי התקנה, למשל מדיסק-און-קי):** מורידים את \`camp-manager-fast-portable-$V.zip\`, לחיצה ימנית ← חילוץ הכול, ופותחים את \`camp-manager.exe\` מתוך התיקייה. הנתונים נשמרים בתיקייה "נתוני ניהול קייטנות" שבתוכה, ועוברים איתה.

          שאר הקבצים בעמוד (\`blockmap\`, \`latest.yml\`, \`app-update.json\`, \`asar.gz\`, וגם \`portable\` שהוא בקובץ אחד ואיטי) הם קבצים פנימיים לעדכון אוטומטי, ואין צורך להוריד אותם.
          EOF
          sed -i 's/^          //' release-notes.md
          gh release create "v$V" dist/*.exe dist/*.blockmap dist/latest.yml \
            "dist/camp-manager-fast-portable-$V.zip" dist/update-assets/* \
            --title "$V" --target "$GITHUB_SHA" --notes-file release-notes.md
